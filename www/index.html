<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1f2227">
<title>Captura N6</title>
<style>
:root{
  --bar:#1f2227; --bar-fg:#ffffff; --bg:#f2f3f5; --row:#ffffff; --fg:#2a2d33; --val:#8b919b; --line:#e4e6ea;
  --band:#e8eaee; --bandfg:#9aa0a9; --blue:#e5b36a; --blue-fg:#2a2012; --blue-soft:#f4e6cd; --blue-softfg:#b39a72; --acc:#8f5f12; --selfg:#2a2012;
  --orange:#3a3f47; --sel:#e5b36a; --good:#1f9d55; --bad:#d63a2f; --warn:#c77700; --code:#eceff3;
  --tile:#ffffff; --shadow:0 1px 3px rgba(20,25,35,.12);
  --contour:#9a4a08; --pt:#b87a1a;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bar:#16181b; --bg:#121417; --row:#1c1f24; --fg:#e6e8eb; --val:#8f96a1; --line:#2a2e35; --band:#181b1f; --bandfg:#7d848f;
  --blue:#e5b36a; --blue-soft:#3a3223; --blue-softfg:#9a8560; --acc:#e5b36a; --selfg:#ffffff; --orange:#aeb4be; --sel:#7a5a22; --code:#171a1e; --tile:#1c1f24; --shadow:none;
  --contour:#e0a35c; --pt:#e5b36a; --warn:#e0a35c; color-scheme:dark}}
:root[data-theme="dark"]{
  --bar:#16181b; --bg:#121417; --row:#1c1f24; --fg:#e6e8eb; --val:#8f96a1; --line:#2a2e35; --band:#181b1f; --bandfg:#7d848f;
  --blue:#e5b36a; --blue-soft:#3a3223; --blue-softfg:#9a8560; --acc:#e5b36a; --selfg:#ffffff; --orange:#aeb4be; --sel:#7a5a22; --code:#171a1e; --tile:#1c1f24; --shadow:none;
  --contour:#e0a35c; --pt:#e5b36a; --warn:#e0a35c; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.35;overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
/* barra superior */
.bar{flex:none;background:var(--bar);color:var(--bar-fg);display:flex;align-items:center;gap:10px;min-height:48px;
  padding:max(0px,env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px))}
.bar .ttl{flex:1;text-align:center;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{background:none;border:0;color:var(--bar-fg);min-width:40px;height:44px;font-size:22px;cursor:pointer;border-radius:8px}
.bar .help{border:1.5px solid #fff;border-radius:50%;width:24px;height:24px;min-width:24px;font-size:14px;font-weight:700;margin:0 4px}
.bar.home{padding-top:max(4px,env(safe-area-inset-top,0px));padding-bottom:6px}
.bar .logo{width:34px;height:34px;border-radius:8px;flex:none}
.bar .proj{flex:1;min-width:0;text-align:left;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;color:#fff;padding:6px 8px;height:auto}
.bar .proj small{display:block;font-size:11px;font-weight:400;opacity:.7}
.st{display:flex;flex-direction:column;align-items:flex-end;font-size:11px;line-height:1.2;white-space:nowrap}
.st b{font-size:13px}
.st.on b{color:#5be2a3}
/* pantalla */
#screen{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;position:relative}
#screen.full{overflow:hidden}
.pad{padding:12px}
/* filas */
.band{background:var(--band);color:var(--bandfg);font-size:12px;padding:7px 14px;letter-spacing:.02em}
.row{display:flex;align-items:center;gap:12px;background:var(--row);min-height:48px;padding:6px 14px;border-bottom:1px solid var(--line);width:100%;text-align:left;border-left:0;border-right:0;border-top:0;color:var(--fg)}
.row>.l{flex:none;max-width:48%}
.row>.v{flex:1;min-width:0;text-align:right;color:var(--val);overflow-wrap:anywhere}
.row.link{cursor:pointer}
.row.link>.v::after{content:" ›";color:var(--val);font-size:18px;vertical-align:-1px}
.row input,.row select{flex:1;min-width:0;background:none;border:0;text-align:right;color:var(--fg);padding:8px 0;outline:none}
.row select{direction:rtl;cursor:pointer}
.row input::placeholder{color:var(--val);opacity:.6}
.row .u{color:var(--val);font-size:12px;flex:none}
.row .clr{flex:none;border:0;background:var(--val);color:var(--row);width:18px;height:18px;border-radius:50%;font-size:12px;line-height:18px;padding:0;cursor:pointer}
.row.sel{background:var(--sel);color:var(--selfg)}
.row.sel .v,.row.sel .u{color:var(--selfg);opacity:.8}
.row.static{cursor:default}
.note{padding:10px 14px;color:var(--val);font-size:12.5px}
.err{color:var(--bad);padding:8px 14px;font-size:12.5px;white-space:pre-wrap}
/* interruptor */
.sw{flex:none;width:44px;height:26px;border-radius:13px;background:var(--blue-soft);position:relative;border:0;padding:0;cursor:pointer;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked=true]{background:var(--blue)}
.sw[aria-checked=true]::after{transform:translateX(18px)}
/* barra de acciones inferior */
#actions{flex:none;display:flex;gap:8px;padding:8px max(10px,env(safe-area-inset-right,0px)) max(8px,env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:var(--bg);border-top:1px solid var(--line)}
#actions:empty{display:none}
.btn{flex:1;min-width:0;height:42px;border-radius:5px;border:0;background:var(--blue);color:var(--blue-fg);font-weight:600;font-size:14px;cursor:pointer;padding:0 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.sec{background:var(--blue-soft);color:var(--acc)}
.btn.dng{background:var(--bad)}
.btn:disabled{background:var(--blue-soft);color:var(--blue-softfg);cursor:not-allowed}
.btn.sm{flex:none;height:34px;padding:0 14px}
.btn.mini{flex:none;width:44px}
/* cuadrícula de módulos */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--row);align-content:start}
.homewrap{background:var(--row);min-height:100%}
@media (min-width:700px){.grid{grid-template-columns:repeat(5,1fr)}}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;padding:18px 6px 14px;background:none;border:0;color:var(--fg);font-size:12.5px;text-align:center;cursor:pointer;line-height:1.2}
.tile .ico{width:38px;height:38px}
.tile:active{background:var(--band)}
.ico{--ip:var(--blue);--ia:var(--orange);--iw:var(--row)}
.p{fill:var(--ip)} .a{fill:var(--ia)} .w{fill:var(--iw)}
.s{fill:none;stroke:var(--ip);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sa{fill:none;stroke:var(--ia);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.list .row .ico{width:26px;height:26px;flex:none}
/* pestañas inferiores */
#tabs{flex:none;display:grid;grid-template-columns:repeat(3,1fr);background:var(--row);border-top:1px solid var(--line);
  padding-bottom:max(0px,env(safe-area-inset-bottom,0px));padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px 6px;color:var(--val);font-size:11px;cursor:pointer}
#tabs button .ico{width:24px;height:24px}
#tabs button .ico{--ip:var(--val);--ia:var(--val)}
#tabs button[aria-selected=true]{color:var(--acc)}
#tabs button[aria-selected=true] .ico{--ip:var(--blue);--ia:var(--orange)}
/* tabla de puntos */
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px;background:var(--row)}
.tbl th{position:sticky;top:0;background:var(--band);color:var(--bandfg);font-weight:600;font-size:12px;padding:7px 8px;text-align:right;z-index:1}
.tbl td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:nth-child(2),.tbl td:nth-child(2),.tbl th:last-child,.tbl td:last-child{text-align:left}
.tbl tr.sel td{background:var(--sel);color:var(--selfg)}
.tbl td .mk{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--blue)}
.tbl td .mk.in{background:var(--orange);border-radius:2px}
.tools{display:flex;gap:8px;padding:8px 12px;background:var(--row);border-bottom:1px solid var(--line);align-items:center}
.tools select,.tools input{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:7px 8px;min-width:0;color:var(--fg)}
.tools input{flex:1}
.count{padding:6px 14px;font-size:12.5px;color:var(--val);background:var(--row)}
/* diálogos */
#dlg{position:fixed;inset:0;z-index:2000;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:24px}
.dlg{background:var(--row);width:min(420px,100%);max-height:84vh;border-radius:6px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 8px 28px rgba(0,0,0,.35)}
.dlg .dt{background:var(--bar);color:#fff;text-align:center;padding:11px 12px;font-weight:600}
.dlg .db{overflow:auto}
.dlg .opt{display:flex;align-items:center;gap:12px;padding:13px 16px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;color:var(--fg);cursor:pointer}
.dlg .rd{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid var(--blue-softfg)}
.dlg .opt[aria-checked=true] .rd{border-color:var(--blue);background:radial-gradient(var(--blue) 0 45%,transparent 50%)}
.dlg .msg{padding:18px 16px;text-align:center;white-space:pre-line}
.dlg .da{display:flex;gap:8px;padding:10px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(30,32,36,.94);color:#fff;padding:9px 16px;border-radius:6px;z-index:3000;font-size:13px;max-width:86vw;text-align:center}
/* recepción en vivo */
.rx{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--val)}
.rx[data-state=recv]{color:var(--good);font-weight:600}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{display:block;width:3px;height:3px;border-radius:1px;background:var(--val)}
[data-state=wait] .eq i{background:var(--blue);animation:eqw 1.8s ease-in-out infinite}
[data-state=recv] .eq i{background:var(--good);animation:eq .6s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.15s}.eq i:nth-child(3){animation-delay:.3s}.eq i:nth-child(4){animation-delay:.45s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}@keyframes eqw{0%,100%{height:3px}50%{height:6px}}
.rxprog{position:relative;height:3px;background:var(--line);overflow:hidden}
.rxprog::after{content:"";position:absolute;top:0;bottom:0;left:0;width:35%;background:var(--blue);opacity:0}
.rxprog[data-state=recv]::after{background:var(--good);opacity:1;animation:slide 1s linear infinite}
.rxprog[data-state=wait]::after{opacity:.4;animation:slide 2.6s linear infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(300%)}}
@media (prefers-reduced-motion:reduce){.eq i,.rxprog::after{animation:none!important}}
.big{padding:14px;background:var(--row);border-bottom:1px solid var(--line);display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.big .nm{font-size:22px;font-weight:700}
.big .cd{color:var(--val)}
.log{font-family:var(--mono);font-size:12px;background:var(--code);padding:10px;white-space:pre-wrap;word-break:break-all;min-height:60vh}
/* dibujo y mapa */
.stage{position:absolute;inset:0;display:flex;flex-direction:column}
.stage .view{flex:1;min-height:0;position:relative;background:var(--bg)}
#plan{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;display:block}
#plan .grid{stroke:var(--line);stroke-width:1}
#plan .ln{stroke:var(--val);stroke-width:1.3;fill:none}
#plan .pt{fill:var(--pt);stroke:var(--bg);stroke-width:1.5}
#plan .pt.in{fill:var(--orange)}
#plan .pt.sel{fill:var(--bad)}
#plan .lbl{fill:var(--fg);font:11px var(--mono)}
#plan .lbl2{fill:var(--val);font:10px var(--mono)}
#plan .ax{fill:var(--val);font:10px var(--mono)}
#plan .sc{stroke:var(--fg);stroke-width:2}
#plan .north{fill:var(--fg)}
#plan .cl{stroke:var(--contour);stroke-width:.9;fill:none;stroke-linejoin:round}
#plan .cl.idx{stroke-width:1.9}
#plan .cll{fill:var(--contour);font:600 10px var(--mono);paint-order:stroke;stroke:var(--bg);stroke-width:3px;stroke-linejoin:round}
#plan .poly{fill:rgba(229,179,106,.35);stroke:var(--pt);stroke-width:2}
#map{position:absolute;inset:0;background:var(--code)}
.cl-t{position:absolute;transform:translate(-50%,-50%);font:600 11px ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
.fab{position:absolute;right:10px;top:10px;bottom:10px;z-index:500;display:flex;flex-direction:column;flex-wrap:wrap-reverse;align-content:flex-start;gap:8px;pointer-events:none}.fab button{pointer-events:auto}
.fab.l{right:auto;left:10px}
.fab button{width:42px;height:42px;border-radius:6px;border:0;background:var(--row);color:var(--fg);box-shadow:var(--shadow);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.fab button .ico{width:22px;height:22px}
.infobar{flex:none;background:var(--row);border-top:1px solid var(--line);padding:7px 14px;font-size:12.5px;display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;font-variant-numeric:tabular-nums}
.mapmsg{position:absolute;left:10px;right:60px;top:10px;z-index:500;background:var(--row);color:var(--warn);padding:8px 12px;border-radius:6px;box-shadow:var(--shadow);font-size:12.5px}
.leaflet-container{font-family:var(--font)}
/* modo inmersivo */
body.imm .bar,body.imm #tabs,body.imm #actions{display:none}
.tabs2{display:flex;background:var(--row);border-bottom:1px solid var(--line)}
.tabs2 button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:11px 0;color:var(--val);font-weight:600;cursor:pointer}
.tabs2 button[aria-selected=true]{color:var(--acc);border-bottom-color:var(--blue)}
.about{padding:34px 16px;text-align:center;color:var(--fg)}
.about .logo{width:84px;height:84px;border-radius:18px}
.about small{display:block;color:var(--val);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;background:var(--row)}
.chips button{background:var(--band);border:0;border-radius:14px;padding:6px 12px;color:var(--fg);cursor:pointer}
.res{background:var(--row)}
.res .row .v{color:var(--fg);font-weight:600}

.fab .ico{--ip:var(--fg);--ia:var(--orange)}
.biglogo{width:84px;height:84px;border-radius:18px}
.row .ico{width:26px;height:26px;flex:none}
.tbl th,.tbl td{padding-left:5px;padding-right:5px}
.tbl{font-size:12.5px}
.btn{font-size:12.5px;padding:0 3px}
#actions{gap:6px}

#plan .selring{fill:none;stroke:var(--bad);stroke-width:2}
.symrow .ico2{flex:none;width:24px;height:24px}
.symmk{background:none;border:0}
.about .wm{width:min(240px,70%);height:auto;margin-bottom:6px}
.ico2{width:24px;height:24px;flex:none}

.livechip{position:absolute;left:10px;top:10px;z-index:500;display:flex;align-items:center;gap:8px;background:var(--row);color:var(--fg);border:1px solid var(--line);border-radius:22px;padding:4px 5px 4px 10px;box-shadow:0 2px 8px rgba(0,0,0,.18);font:inherit;font-size:12px;cursor:pointer}
.livechip .lc{background:var(--blue);color:var(--blue-fg);border-radius:16px;padding:5px 10px;font-weight:600}
#plan .newring{fill:none;stroke:var(--pt);stroke-width:2.5;transform-box:fill-box;transform-origin:center;animation:ping 1.5s ease-out infinite}
@keyframes ping{0%{transform:scale(.5);opacity:1}100%{transform:scale(1.9);opacity:0}}
@media (prefers-reduced-motion:reduce){#plan .newring{animation:none}}
.fab button.on{background:var(--blue);color:var(--blue-fg)}

</style>
</head>

<symbol id="i-format" viewBox="0 0 24 24"><rect class="p" x="3" y="3" width="18" height="4" rx="1"/><rect class="p" x="3" y="10" width="18" height="4" rx="1" opacity=".6"/><rect class="a" x="3" y="17" width="12" height="4" rx="1"/></symbol>

<symbol id="i-area" viewBox="0 0 24 24"><path class="p" d="M4 8l8-5 8 6-3 10H7z" opacity=".85"/><circle class="a" cx="4" cy="8" r="2"/><circle class="a" cx="12" cy="3" r="2"/><circle class="a" cx="20" cy="9" r="2"/><circle class="a" cx="17" cy="19" r="2"/><circle class="a" cx="7" cy="19" r="2"/></symbol>

<script>

function isNum(s){ return s!==undefined && s!=='' && /^[+-]?(\d+\.?\d*|\.\d+)$/.test(s); }

function toRad(v, unit){
  if(unit==='deg') return v*Math.PI/180;
  if(unit==='gon') return v*Math.PI/200;
  // GGG.MMSS
  const sign = v<0?-1:1, a=Math.abs(v);
  const d=Math.floor(a);
  const rest=Math.round((a-d)*1e6)/1e6;
  const mm=Math.floor(rest*100+1e-9);
  const ss=(rest*100-mm)*100;
  return sign*(d+mm/60+ss/3600)*Math.PI/180;
}

function parseGSI(line){
  const re=/(\d\d)(\S{4})([+-])(\w{8,16})/g;
  const w={}; let m;
  const body=line.replace(/^\*/,'');
  while((m=re.exec(body))){
    const wi=m[1], unit=m[2].slice(-1);
    let v=parseInt(m[4],10);
    if(isNaN(v)) { w[wi]=m[4]; continue; }
    if(m[3]==='-') v=-v;
    w[wi]={v,unit};
  }
  const scale=u=> u==='6'?1e-4: u==='8'?1e-5 : 1e-3;
  const get=k=> w[k]&&typeof w[k]==='object' ? w[k].v*scale(w[k].unit) : undefined;
  if(get('81')===undefined||get('82')===undefined) return null;
  const idw=w['11'];
  const id=idw&&typeof idw==='object'? String(idw.v) : (typeof idw==='string'? idw.replace(/^0+/,''):'');
  const codeW=w['71'];
  const code=codeW&&typeof codeW==='object'? String(codeW.v):'';
  return {id:id||'', n:get('82'), e:get('81'), z:get('83')!==undefined?get('83'):0, code};
}

function parseText(text, opts, startIndex){
  const pts=[], errors=[];
  let auto=startIndex||1;
  const lines=text.split(/\r?\n/);
  const first=Math.max(1,Math.floor(opts.startRow||1));
  lines.forEach((raw,i)=>{
    if(i+1<first) return;
    const line=raw.trim();
    if(!line) return;
    if(/^\*?11\S{4}[+-]\w+/.test(line)){
      const p=parseGSI(line);
      if(p){ if(!p.id) p.id=(opts.prefix||'')+(auto++); pts.push(p); }
      else errors.push('Línea '+(i+1)+': GSI sin coordenadas.');
      return;
    }
    const delim=/[,;\t]/.test(line);
    const t=(delim?line.split(/\s*[,;\t]\s*/):line.split(/\s+/)).filter(Boolean);
    let k=-1;
    for(let j=1;j<=3;j++){
      if(isNum(t[j])&&isNum(t[j+1])&&isNum(t[j+2])){k=j;break;}
    }
    // "PT 2 1005.25 2003.10 350.40": ID separado por espacio en dos palabras
    if(!delim && k===1 && !isNum(t[0]) && isNum(t[4])) k=2;
    let id, a,b,c, code;
    if(k===-1){
      if(t.length===3 && t.every(isNum)){ id=(opts.prefix||'')+(auto++); a=+t[0]; b=+t[1]; c=+t[2]; code=''; }
      else { errors.push('Línea '+(i+1)+' no reconocida: '+line.slice(0,60)); return; }
    } else {
      id=t.slice(0,k).join('_'); a=+t[k]; b=+t[k+1]; c=+t[k+2]; code=t.slice(k+3).join(' ');
    }
    if(opts.order==='CASS' && opts.mode!=='polar' && k>=1){
      const cc=(k>1?t.slice(1,k):[]).concat(t.slice(k+3)).join(' ');
      pts.push({id:t[0],n:b,e:a,z:c,code:cc}); return;
    }
    if(opts.mode==='polar'){
      const hz=toRad(a,opts.angUnit), z=toRad(b,opts.angUnit), sd=c;
      const orient=toRad(opts.orient||0,opts.angUnit);
      const hd=sd*Math.sin(z), dz=sd*Math.cos(z);
      const az=hz+orient;
      pts.push({id, n:opts.stN+hd*Math.cos(az), e:opts.stE+hd*Math.sin(az),
                z:opts.stZ+opts.hi+dz-opts.hr, code});
    } else {
      if(opts.order==='ENZ') pts.push({id,n:b,e:a,z:c,code});
      else pts.push({id,n:a,e:b,z:c,code});
    }
  });
  return {pts,errors,next:auto};
}

function toDXF(pts,contours){
  const o=[];
  const g=(c,v)=>{o.push(String(c));o.push(String(v));};
  const layers=['PUNTOS','NUMEROS','COTAS','CODIGOS','CURVAS','CURVAS_MAESTRAS'];
  g(0,'SECTION');g(2,'HEADER');g(9,'$ACADVER');g(1,'AC1009');g(0,'ENDSEC');
  g(0,'SECTION');g(2,'TABLES');
  g(0,'TABLE');g(2,'LAYER');g(70,layers.length);
  layers.forEach((l,i)=>{g(0,'LAYER');g(2,l);g(70,0);g(62,[7,3,2,4,30,1][i]);g(6,'CONTINUOUS');});
  g(0,'ENDTAB');g(0,'ENDSEC');
  g(0,'SECTION');g(2,'ENTITIES');
  const txt=(layer,x,y,z,h,s)=>{ if(!s) return; g(0,'TEXT');g(8,layer);g(10,x.toFixed(3));g(20,y.toFixed(3));g(30,z.toFixed(3));g(40,h);g(1,String(s).replace(/[\r\n]/g,' '));};
  pts.forEach(p=>{
    // DXF: X = Este, Y = Norte
    g(0,'POINT');g(8,'PUNTOS');g(10,p.e.toFixed(3));g(20,p.n.toFixed(3));g(30,p.z.toFixed(3));
    txt('NUMEROS',p.e+0.3,p.n+0.3,p.z,0.4,p.id);
    txt('COTAS',p.e+0.3,p.n-0.5,p.z,0.3,p.z.toFixed(3));
    txt('CODIGOS',p.e+0.3,p.n-1.1,p.z,0.3,p.code);
  });
  if(contours&&contours.lines){
    contours.lines.forEach(l=>{
      const layer=l.index?'CURVAS_MAESTRAS':'CURVAS';
      g(0,'POLYLINE');g(8,layer);g(66,1);g(10,0);g(20,0);g(30,l.z.toFixed(3));g(70,l.closed?1:0);
      l.pts.forEach(q=>{g(0,'VERTEX');g(8,layer);g(10,q[0].toFixed(3));g(20,q[1].toFixed(3));g(30,l.z.toFixed(3));});
      g(0,'SEQEND');g(8,layer);
      if(l.index&&l.pts.length>=4){ const m=l.pts[Math.floor(l.pts.length/2)]; txt(layer,m[0],m[1],l.z,0.4,l.z.toFixed(contours.step>=1?0:2)); }
    });

// UTM WGS84 (este, norte) a [latitud, longitud] en grados
function utmToLatLon(E,N,zone,south){
  const a=6378137, f=1/298.257223563, k0=0.9996;
  const e2=f*(2-f), ep2=e2/(1-e2);
  const x=E-500000, y=south?N-10000000:N;
  const M=y/k0;
  const mu=M/(a*(1-e2/4-3*e2*e2/64-5*e2*e2*e2/256));
  const e1=(1-Math.sqrt(1-e2))/(1+Math.sqrt(1-e2));
  const phi1=mu+(3*e1/2-27*Math.pow(e1,3)/32)*Math.sin(2*mu)
    +(21*e1*e1/16-55*Math.pow(e1,4)/32)*Math.sin(4*mu)
    +(151*Math.pow(e1,3)/96)*Math.sin(6*mu)
    +(1097*Math.pow(e1,4)/512)*Math.sin(8*mu);
  const s1=Math.sin(phi1), c1=Math.cos(phi1), t1=Math.tan(phi1);
  const N1=a/Math.sqrt(1-e2*s1*s1);
  const T1=t1*t1, C1=ep2*c1*c1;
  const R1=a*(1-e2)/Math.pow(1-e2*s1*s1,1.5);
  const D=x/(N1*k0);
  const lat=phi1-(N1*t1/R1)*(D*D/2-(5+3*T1+10*C1-4*C1*C1-9*ep2)*Math.pow(D,4)/24
    +(61+90*T1+298*C1+45*T1*T1-252*ep2-3*C1*C1)*Math.pow(D,6)/720);
  const lon0=((zone-1)*6-180+3)*Math.PI/180;
  const lon=lon0+(D-(1+2*T1+C1)*Math.pow(D,3)/6
    +(5-2*C1+28*T1-3*C1*C1+8*ep2+24*T1*T1)*Math.pow(D,5)/120)/c1;
  return [lat*180/Math.PI, lon*180/Math.PI];
}
// Triangulación de Delaunay (Bowyer-Watson). pts: [{x,y}] -> [[i,j,k], ...]
function delaunay(pts){
  const n=pts.length; if(n<3) return [];
  let minx=Infinity,miny=Infinity,maxx=-Infinity,maxy=-Infinity;
  pts.forEach(p=>{minx=Math.min(minx,p.x);maxx=Math.max(maxx,p.x);miny=Math.min(miny,p.y);maxy=Math.max(maxy,p.y);});
  const dm=Math.max(maxx-minx,maxy-miny)||1, mx=(minx+maxx)/2, my=(miny+maxy)/2;
  // pequeño desplazamiento determinista para evitar puntos cocirculares exactos (mallas regulares)
  const P=pts.map((p,i)=>[p.x+Math.sin(i*12.9898)*1e-7*dm, p.y+Math.cos(i*78.233)*1e-7*dm]);
  P.push([mx-20*dm,my-dm],[mx,my+20*dm],[mx+20*dm,my-dm]);
  function mkTri(a,b,c){
    const ax=P[a][0],ay=P[a][1],bx=P[b][0],by=P[b][1],cx=P[c][0],cy=P[c][1];
    const d=2*(ax*(by-cy)+bx*(cy-ay)+cx*(ay-by));
    if(Math.abs(d)<1e-30) return {a,b,c,x:0,y:0,r2:Infinity};
    const a2=ax*ax+ay*ay,b2=bx*bx+by*by,c2=cx*cx+cy*cy;
    const ux=(a2*(by-cy)+b2*(cy-ay)+c2*(ay-by))/d, uy=(a2*(cx-bx)+b2*(ax-cx)+c2*(bx-ax))/d;
    return {a,b,c,x:ux,y:uy,r2:(ax-ux)*(ax-ux)+(ay-uy)*(ay-uy)};
  }
  let tris=[mkTri(n,n+1,n+2)];
  for(let i=0;i<n;i++){
    const px=P[i][0],py=P[i][1];
    const bad=[], keep=[];
    for(const t of tris){
      const dx=px-t.x,dy=py-t.y;
      (dx*dx+dy*dy<t.r2?bad:keep).push(t);
    }
    const edges=new Map();
    const addE=(u,v)=>{ const k=u<v?u+'_'+v:v+'_'+u; const e=edges.get(k); if(e) e.c++; else edges.set(k,{u,v,c:1}); };
    for(const t of bad){ addE(t.a,t.b); addE(t.b,t.c); addE(t.c,t.a); }
    tris=keep;
    edges.forEach(e=>{ if(e.c===1) tris.push(mkTri(e.u,e.v,i)); });
  }
  return tris.filter(t=>t.a<n&&t.b<n&&t.c<n).map(t=>[t.a,t.b,t.c]);
}

function niceNum(v){ const p=Math.pow(10,Math.floor(Math.log10(v))); const m=v/p; return (m>=5?5:m>=2?2:1)*p; }

function chaikin(line,closed,iters){
  let pts=line;
  for(let it=0;it<iters;it++){
    const out=[]; const n=pts.length;
    if(!closed) out.push(pts[0]);
    const last=closed?n:n-1;
    for(let i=0;i<last;i++){
      const a=pts[i], b=pts[(i+1)%n];
      out.push([0.75*a[0]+0.25*b[0],0.75*a[1]+0.25*b[1]]);
      out.push([0.25*a[0]+0.75*b[0],0.25*a[1]+0.75*b[1]]);
    }
    if(!closed) out.push(pts[n-1]);
    pts=out;
  }
  return pts;
}

// Curvas de nivel por triangulación (TIN). Devuelve {step,lines:[{z,index,closed,pts:[[e,n],..]}],info}
function computeContours(points, opt){
  opt=opt||{};
  const res={step:0,levels:0,lines:[],info:''};
  // quitar puntos duplicados en planta (a 1 mm)
  const seen=new Map(), P=[];
  points.forEach(p=>{
    if(!isFinite(p.e)||!isFinite(p.n)||!isFinite(p.z)) return;
    const k=Math.round(p.e*1000)+'_'+Math.round(p.n*1000);
    if(!seen.has(k)){ seen.set(k,P.length); P.push({x:p.e,y:p.n,z:p.z}); }
  });
  if(P.length<3){ res.info='Se necesitan al menos 3 puntos con cota.'; return res; }
  if(P.length>4000){ res.info='Hay más de 4000 puntos: las curvas de nivel se desactivan para no bloquear la app.'; return res; }
  let zmin=Infinity,zmax=-Infinity; P.forEach(p=>{zmin=Math.min(zmin,p.z);zmax=Math.max(zmax,p.z);});
  if(zmax-zmin<1e-6){ res.info='Todos los puntos tienen la misma cota.'; return res; }
  let step=+opt.step>0?+opt.step:niceNum((zmax-zmin)/10);
  while((zmax-zmin)/step>250) step*=2;
  res.step=step;
  let tris=delaunay(P);
  // quitar triángulos casi sin área
  tris=tris.filter(t=>{
    const a=P[t[0]],b=P[t[1]],c=P[t[2]];
    return Math.abs((b.x-a.x)*(c.y-a.y)-(c.x-a.x)*(b.y-a.y))>1e-9;
  });
  if(!tris.length){ res.info='Los puntos están alineados: no se puede formar una superficie.'; return res; }
  if(opt.trim!==false){
    const longest=tris.map(t=>{
      const d=(i,j)=>Math.hypot(P[i].x-P[j].x,P[i].y-P[j].y);
      return Math.max(d(t[0],t[1]),d(t[1],t[2]),d(t[2],t[0]));
    });
    const sorted=longest.slice().sort((a,b)=>a-b);
    const med=sorted[Math.floor(sorted.length/2)];
    const lim=(+opt.maxEdge>0)?+opt.maxEdge:3*med;
    tris=tris.filter((t,i)=>longest[i]<=lim);
    if(!tris.length){ res.info='Todos los triángulos quedaron fuera del límite de lado.'; return res; }
  }
  res.P=P; res.tris=tris; res.zmin=zmin; res.zmax=zmax;
  const lv0=Math.ceil(zmin/step-1e-9), lv1=Math.floor(zmax/step+1e-9);
  const smooth=opt.smooth!==false;
  for(let li=lv0;li<=lv1;li++){
    const lv=li*step;
    // puntos de cruce identificados por la arista (exactos y compartidos entre triángulos vecinos)
    const crossing=new Map();
    const cp=(i,j)=>{
      const lo=i<j?i:j, hi=i<j?j:i, k=lo+'_'+hi;
      let c=crossing.get(k);
      if(!c){
        const a=P[lo], b=P[hi], t=(lv-a.z)/(b.z-a.z);
        c=[a.x+t*(b.x-a.x), a.y+t*(b.y-a.y)];
        crossing.set(k,c);
      }
      return k;
    };
    const adj=new Map();
    const link=(ka,kb)=>{
      if(ka===kb) return;
      if(!adj.has(ka)) adj.set(ka,[]); if(!adj.has(kb)) adj.set(kb,[]);
      adj.get(ka).push(kb); adj.get(kb).push(ka);
    };
    for(const t of tris){
      const z=[P[t[0]].z,P[t[1]].z,P[t[2]].z];
      const up=[z[0]>=lv,z[1]>=lv,z[2]>=lv];
      const s=up[0]+up[1]+up[2];
      if(s===0||s===3) continue;
      const keys=[];
      for(let e=0;e<3;e++){
        const i=t[e], j=t[(e+1)%3];
        if(up[e]!==up[(e+1)%3]) keys.push(cp(i,j));
      }
      if(keys.length===2) link(keys[0],keys[1]);
    }
    // unir segmentos en polilíneas
    const used=new Set();
    const walk=(start)=>{
      const path=[start]; used.add(start);
      let cur=start, prev=null;
      for(;;){
        const nb=adj.get(cur).filter(k=>k!==prev);
        let nx=null;
        for(const k of nb){ if(!used.has(k)){ nx=k; break; } }
        if(nx===null){
          // ¿cierra con el inicio?
          const closes=nb.includes(start)&&path.length>2;
          return {path,closed:closes};
        }
        used.add(nx); path.push(nx); prev=cur; cur=nx;
      }
    };
    const out=[];
    adj.forEach((nbs,k)=>{ if(nbs.length===1&&!used.has(k)) out.push(walk(k)); });
    adj.forEach((nbs,k)=>{ if(!used.has(k)) out.push(walk(k)); });
    const isIndex=(li%5===0);
    out.forEach(o=>{
      if(o.path.length<2) return;
      let pts=o.path.map(k=>crossing.get(k));
      if(smooth&&pts.length>=3) pts=chaikin(pts,o.closed,2);
      res.lines.push({z:lv,index:isIndex,closed:o.closed,pts});
    });
  }
  res.levels=lv1-lv0+1;
  res.info=res.lines.length?'':'No hay curvas con esta equidistancia.';
  return res;
}



/* ===== Cálculos y formatos (v2) ===== */
function wrap360(d){ d=d%360; return d<0?d+360:d; }
// grados decimales -> texto
function fmtAngle(deg,mode,dec){
  dec=dec==null?2:dec;
  if(!isFinite(deg)) return '';
  if(mode==='deg') return deg.toFixed(Math.max(4,dec))+'°';
  if(mode==='gon') return (deg*400/360).toFixed(Math.max(4,dec))+' gon';
  if(mode==='rad') return (deg*Math.PI/180).toFixed(6)+' rad';
  const sign=deg<0?'-':''; let a=Math.abs(deg);
  let d=Math.floor(a), m=Math.floor((a-d)*60), sc=((a-d)*60-m)*60;
  const f=Math.pow(10,dec); sc=Math.round(sc*f)/f;
  if(sc>=60){ sc=0; m++; } if(m>=60){ m=0; d++; }
  if(mode==='dms2') return sign+d+'.'+String(m).padStart(2,'0')+String(Math.floor(sc)).padStart(2,'0');
  return sign+d+'°'+String(m).padStart(2,'0')+"'"+sc.toFixed(dec).padStart(dec?3+dec:2,'0')+'"';
}
// GGG.MMSS -> grados decimales
function dmsToDeg(v){ return toRad(v,'dms')*180/Math.PI; }
function degFromUnit(v,unit){
  if(unit==='dms') return dmsToDeg(v);
  if(unit==='gon') return v*360/400;
  if(unit==='rad') return v*180/Math.PI;
  return v;
}
// Inversa de coordenadas A -> B
function inverse(a,b){
  const dn=b.n-a.n, de=b.e-a.e, dz=(b.z||0)-(a.z||0);
  const hd=Math.hypot(dn,de);
  return {hd, az:wrap360(Math.atan2(de,dn)*180/Math.PI), dz, slope:hd>0?dz/hd*100:NaN, sd:Math.hypot(hd,dz)};
}
// Radiación: punto B desde A con acimut (grados) y distancia horizontal
function radiate(a,azDeg,hd,dz){
  const r=azDeg*Math.PI/180;
  return {n:a.n+hd*Math.cos(r), e:a.e+hd*Math.sin(r), z:(a.z||0)+(dz||0)};
}
function divideLine(a,b,n){
  const out=[]; for(let i=1;i<n;i++){ const t=i/n; out.push({n:a.n+(b.n-a.n)*t,e:a.e+(b.e-a.e)*t,z:(a.z||0)+((b.z||0)-(a.z||0))*t}); } return out;
}
// Área (fórmula del topógrafo) y perímetro de un polígono cerrado
function polygonMetrics(pts){
  const n=pts.length; if(n<2) return {area:0,perimeter:0};
  let a2=0, per=0;
  for(let i=0;i<n;i++){
    const p=pts[i], q=pts[(i+1)%n];
    a2+=p.e*q.n-q.e*p.n;
    per+=Math.hypot(q.e-p.e,q.n-p.n);
  }
  if(n===2) per=per/2*2;
  return {area:Math.abs(a2)/2, perimeter:per};
}
// WGS84 lat/lon (grados) -> UTM
function latLonToUTM(lat,lon,zoneIn){
  const a=6378137,f=1/298.257223563,k0=.9996,e2=f*(2-f),ep2=e2/(1-e2);
  const zone=zoneIn||Math.floor((lon+180)/6)+1;
  const la=lat*Math.PI/180, lo=lon*Math.PI/180, lo0=((zone-1)*6-180+3)*Math.PI/180;
  const N=a/Math.sqrt(1-e2*Math.sin(la)**2), T=Math.tan(la)**2, C=ep2*Math.cos(la)**2, A=(lo-lo0)*Math.cos(la);
  const M=a*((1-e2/4-3*e2**2/64-5*e2**3/256)*la-(3*e2/8+3*e2**2/32+45*e2**3/1024)*Math.sin(2*la)+(15*e2**2/256+45*e2**3/1024)*Math.sin(4*la)-(35*e2**3/3072)*Math.sin(6*la));
  const e=k0*N*(A+(1-T+C)*A**3/6+(5-18*T+T*T+72*C-58*ep2)*A**5/120)+500000;
  let n=k0*(M+N*Math.tan(la)*(A*A/2+(5-T+9*C+4*C*C)*A**4/24+(61-58*T+T*T+600*C-330*ep2)*A**6/720));
  const south=lat<0; if(south) n+=10000000;
  return {e,n,zone,south};
}

/* ----- Exportación ----- */
function fx(v,d){ return (+v).toFixed(d==null?3:d); }
function toNEH(pts,sep,head,d){
  const r=head?['Punto'+sep+'Norte'+sep+'Este'+sep+'Altura'+sep+'Codigo']:[];
  pts.forEach(p=>r.push([p.id,fx(p.n,d),fx(p.e,d),fx(p.z,d),p.code||''].join(sep)));
  return r.join('\r\n')+'\r\n';
}
function toCass(pts,d){
  // CASS: Punto, Código, Este (Y), Norte (X), Altura
  return pts.map(p=>[p.id,p.code||'',fx(p.e,d),fx(p.n,d),fx(p.z,d)].join(',')).join('\r\n')+'\r\n';
}
function xmlEsc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toKML(pts,zone,south,name){
  const pm=pts.map(p=>{ const ll=utmToLatLon(p.e,p.n,zone,south);
    return '<Placemark><name>'+xmlEsc(p.id)+'</name><description>'+xmlEsc((p.code||'')+' Z='+fx(p.z,3))+'</description><Point><coordinates>'+ll[1].toFixed(8)+','+ll[0].toFixed(8)+','+fx(p.z,3)+'</coordinates></Point></Placemark>'; }).join('\n');
  return '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>'+xmlEsc(name||'Puntos')+'</name>\n'+pm+'\n</Document></kml>\n';
}
function toHTMLReport(pts,meta,d){

  return '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>'+xmlEsc(meta.name)+'</title><style>body{font-family:system-ui,sans-serif;margin:24px}table{border-collapse:collapse}td,th{border:1px solid #bbb;padding:4px 10px;text-align:right}th{background:#eee}td:first-child,td:last-child{text-align:left}</style></head><body><h1>'+xmlEsc(meta.name)+'</h1><p>Operador: '+xmlEsc(meta.operator||'')+' · Equipo: '+xmlEsc(meta.device||'')+' · Fecha: '+xmlEsc(meta.date||'')+' · Puntos: '+pts.length+'</p><table><tr><th>Punto</th><th>Norte</th><th>Este</th><th>Altura</th><th>Código</th></tr>\n'+rows+'\n</table></body></html>\n';
}
// Formato personalizado: patrón con campos entre corchetes
const CUSTOM_FIELDS=['Nombre','Código','Norte','Este','Altura','Latitud','Longitud'];
function toCustom(pts,fmt,zone,south,d){
  const sep=fmt.sep==='tab'?'\t':fmt.sep==='space'?' ':(fmt.sep||',');
  const names=(fmt.pattern.match(/\[[^\]]+\]/g)||[]);
  const rows=[];
  if(fmt.head) rows.push(names.map(n=>n.slice(1,-1)).join(sep));
  pts.forEach(p=>{
    const ll=(/Latitud|Longitud/.test(fmt.pattern))?utmToLatLon(p.e,p.n,zone,south):[0,0];
    rows.push(names.map(n=>{
      switch(n.slice(1,-1)){
        case 'Nombre': return p.id; case 'Código': return p.code||'';
        case 'Norte': return fx(p.n,d); case 'Este': return fx(p.e,d); case 'Altura': return fx(p.z,d);
        case 'Latitud': return ll[0].toFixed(8); case 'Longitud': return ll[1].toFixed(8); default: return '';
      }}).join(sep));
  });
  return rows.join('\r\n')+'\r\n';
}

/* ---------- navegación ---------- */
const screens={};
let tab=store.get('n6.tab','proj'), stack=[], curDef=null;

  return {st:!rx.on?'off':(recv?'recv':'wait'),
    txt:!rx.on?'Sin conexión':(recv?('Recibiendo… '+rx.sess+(rx.sess===1?' punto':' puntos')):(rx.sess?('Conectado · '+rx.sess+' puntos recibidos'):'Conectado · esperando datos'))};
}
function updateStatus(){
  const s=$('#stat'); if(s){ const r=rxText(); s.className='st'+(rx.on?' on':''); s.textContent=''; s.append(h('b',null,rx.on?(r.st==='recv'?'Recibiendo':'Conectado'):'Sin conexión'),h('span',null,proj.points.length+' puntos')); }

const logLines=[];

function ingestLive(text){
  const r=parseText(text,parseOpts({startRow:1}),proj.next);
  proj.next=r.next;

  if(r.errors.length) logLine('! '+r.errors[0]);

  return res;
}

/* ---------- enlace con la estación ---------- */
const link={
  kind:NATIVE?'bt':'serial', addr:null, devices:[], port:null, reader:null, keep:false, buf:'', listener:null, busy:false,
  get connected(){ return rx.on; }
};
(function(){ const dv=store.get('n6.dev',null); if(dv&&dv.address){ link.sel=dv.address; link.devices=[dv]; } })();
async function btScan(){
  const BS=CAP.Plugins.BluetoothSerial;
  let st=await BS.isEnabled(); if(!st.enabled) st=await BS.enable();
  const r=await BS.scan(); link.devices=(r&&r.devices)||[];
  return link.devices;
}
async function btConnect(addr){
  const BS=CAP.Plugins.BluetoothSerial;
  await BS.connect({address:addr}); link.addr=addr;
  await BS.startNotifications({address:addr,delimiter:S.delim});
  link.listener=await BS.addListener('onRead',r=>{
    const line=String((r&&r.value)||'').replace(/[\r\n]+/g,' ').trim();
    if(line){ logLine(line); ingestLive(line); }
  });
  rxConnected(true,'bt');
}
async function btDisconnect(){
  const BS=CAP.Plugins.BluetoothSerial;
  try{ if(link.addr) await BS.stopNotifications({address:link.addr}); }catch(e){}
  try{ if(link.listener) await link.listener.remove(); }catch(e){}
  try{ await BS.disconnect({address:link.addr}); }catch(e){}
  link.listener=null; link.addr=null; rxConnected(false);
}
async function serialConnect(){
  if(!('serial' in navigator)) throw new Error('Este navegador no permite puertos seriales. Usa Chrome en computador o importa un archivo.');
  link.port=await navigator.serial.requestPort();
  await link.port.open({baudRate:+S.baud,parity:S.parity,dataBits:+S.databits});
  rxConnected(true,'serial'); link.keep=true; link.buf='';
  const dec=new TextDecoderStream(); link.port.readable.pipeTo(dec.writable).catch(()=>{});
  link.reader=dec.readable.getReader();
  (async()=>{
    try{
      while(link.keep){
        const {value,done}=await link.reader.read(); if(done) break; if(!value) continue;
        link.buf+=value; let i;
        while((i=link.buf.search(/\r\n|\n|\r/))>=0){
          const line=link.buf.slice(0,i); link.buf=link.buf.slice(i).replace(/^(\r\n|\n|\r)/,'');
          if(line.trim()){ logLine(line); ingestLive(line); }
        }
      }
    }catch(e){} finally{ await serialDisconnect(); }
  })();
}
async function serialDisconnect(){
  link.keep=false;
  try{ if(link.reader){ await link.reader.cancel(); link.reader.releaseLock(); } }catch(e){}
  try{ if(link.port) await link.port.close(); }catch(e){}
  link.reader=null; link.port=null; rxConnected(false);
}
async function linkToggle(){
  if(link.busy) return; link.busy=true;
  try{
    if(rx.on){ NATIVE?await btDisconnect():await serialDisconnect(); toast('Desconectado'); }
    else if(NATIVE){
      if(!link.addr&&!link.sel){ toast('Busca y elige un equipo primero'); }

}

function pointsScreen(mode,cb){
  let field='id', q='', page=0, sel=null; const PS=100;
  const holder=h('div',{style:{overflowX:'auto'}}), cnt=h('div',{class:'count'});
  const fsel=h('select',null,h('option',{value:'id'},'Nombre'),h('option',{value:'code'},'Código'));
  const qi=h('input',{type:'search',placeholder:'Buscar'});
  const go1=h('button',{class:'btn sm',onclick:()=>{ q=qi.value.toLowerCase(); field=fsel.value; page=0; draw(); }},'Buscar');
  const body=h('div',null,h('div',{class:'tools'},fsel,qi,go1),cnt,holder);
  function filtered(){ return proj.points.filter(p=>!q||String(p[field]||'').toLowerCase().includes(q)).slice().reverse(); }
  function draw(){
    const all=filtered(), pages=Math.max(1,Math.ceil(all.length/PS)); if(page>=pages) page=pages-1;
    const slice=all.slice(page*PS,page*PS+PS);
    cnt.textContent='Total '+all.length+'   Página '+(page+1)+'/'+pages;
    holder.textContent='';
    if(!all.length){ holder.append(h('div',{class:'note'},'No hay puntos. Conecta la estación, importa un archivo o pulsa «Agregar».')); }
    else { holder.append(pointRows(slice,()=>sel,p=>{ sel=(sel===p?null:p); draw(); }));
      if(pages>1) holder.append(h('div',{class:'tools'},h('button',{class:'btn sm sec',disabled:page===0?true:null,onclick:()=>{ page--; draw(); }},'‹ Anterior'),h('span',{style:{flex:1,textAlign:'center'}},(page+1)+' / '+pages),h('button',{class:'btn sm sec',disabled:page>=pages-1?true:null,onclick:()=>{ page++; draw(); }},'Siguiente ›'))); }
  }
  const def={title:mode==='pick'?'Elegir punto':'Base de puntos',body,refresh:draw,mounted:draw,
    help:'Todos los puntos del levantamiento. Toca un punto para seleccionarlo. Los puntos azules vienen de la estación; los naranjas se ingresaron a mano.'};
  const need=f=>()=>{ if(!sel){ toast('Selecciona un punto'); return; } f(sel); };
  if(mode==='pick') def.actions=[{l:'Cancelar',cls:'sec',fn:()=>back()},{l:'OK',fn:need(p=>{ back(); cb(p); })}];
  else def.actions=[{l:'Agregar',fn:()=>go('pointEdit',{})},{l:'Editar',fn:need(p=>go('pointEdit',{pt:p}))},{l:'Detalles',fn:need(p=>go('pointDetails',{pt:p}))},{l:'Importar',fn:()=>go('importPts')},
    {l:'…',cls:'mini sec',fn:async()=>{
      const v=await pick('Opciones',[{v:'del',l:'Eliminar el punto seleccionado'},{v:'all',l:'Eliminar todos los puntos'},{v:'sortn',l:'Ordenar por nombre'},{v:'sortt',l:'Ordenar por orden de captura'}]); if(!v) return;
      if(v==='del'){ if(!sel){ toast('Selecciona un punto'); return; } proj.points=proj.points.filter(p=>p!==sel); sel=null; touch(); toast('Punto eliminado'); }
      else if(v==='all'){ if(!proj.points.length) return; if(await confirmDlg('¿Eliminar todos los puntos?\nNo se puede deshacer.','Eliminar')){ proj.points=[]; proj.next=1; sel=null; touch(); toast('Se eliminaron todos los puntos'); } }
      else if(v==='sortn'){ proj.points.sort((a,b)=>String(a.id).localeCompare(String(b.id),undefined,{numeric:true})); touch(); }
      else { proj.points.sort((a,b)=>(a.t||0)-(b.t||0)); touch(); } }}];
  return def;
}

const EXPORTS=()=>[
  {v:'csv',l:'CSV (*.csv)',d:'Punto, Norte, Este, Altura, Código con encabezado'},
  {v:'neh',l:'NEH (*.txt)',d:'Punto, Norte, Este, Altura, Código separados por coma'},
  {v:'cass',l:'CASS (*.dat)',d:'Punto, Código, Este, Norte, Altura'},
  {v:'dxf',l:'AutoCAD (*.dxf)',d:'Puntos, números, cotas, códigos y curvas de nivel (si están activadas)'},
  {v:'kml',l:'Google Earth (*.kml)',d:'Requiere sistema UTM en el proyecto'},
  {v:'html',l:'Informe (*.html)',d:'Tabla de puntos con datos del proyecto'},
  {v:'custom',l:'Personalizado: '+S.custom.name,d:S.custom.pattern}
];
function buildExport(type){
  const pts=proj.points, base='levantamiento'+'_'+stampNow(), d=S.dec;
  const cs=proj.cs;
  switch(type){
    case 'csv': return {name:base+'.csv',mime:'text/csv;charset=utf-8',content:'﻿'+toNEH(pts,',',true,d)};
    case 'neh': return {name:base+'.txt',mime:'text/plain',content:toNEH(pts,',',false,d)};
    case 'cass': return {name:base+'.dat',mime:'text/plain',content:toCass(pts,d)};
    case 'dxf': return {name:base+'.dxf',mime:'application/dxf',content:toDXF(pts,S.contours?computeContours(pts,{step:parseFloat(S.cnStep)||0,smooth:S.cnSmooth,trim:S.cnTrim}):null)};
    case 'kml': if(cs.type!=='utm') throw new Error('Los datos usan coordenadas locales. Cambia a UTM en «Sistema de coordenadas».'); return {name:base+'.kml',mime:'application/vnd.google-earth.kml+xml',content:toKML(pts,cs.zone,cs.south,proj.name)};
    case 'html': return {name:base+'.html',mime:'text/html',content:toHTMLReport(pts,proj,d)};
    case 'custom': return {name:base+'.'+S.custom.ext,mime:'text/plain',content:toCustom(pts,S.custom,cs.zone,cs.south,d)};
  }
}

const SYMS=[{v:'circle',l:'Punto (círculo)'},{v:'triangle',l:'Triángulo'},{v:'square',l:'Cuadrado'},{v:'diamond',l:'Rombo'},{v:'cross',l:'Cruz (+)'},{v:'x',l:'Equis (×)'},{v:'star',l:'Estrella'},{v:'none',l:'Ocultar símbolo'}];
const COLS=[{v:'default',l:'Automático (dorado / gris)'},{v:'red',l:'Rojo'},{v:'blue',l:'Azul'},{v:'green',l:'Verde'},{v:'orange',l:'Naranja'},{v:'purple',l:'Morado'},{v:'yellow',l:'Amarillo'},{v:'black',l:'Negro'}];
const COLHEX={red:'#e0261b',blue:'#2f6df6',green:'#1f9d55',orange:'#f08a24',purple:'#8a3ffc',yellow:'#e6b800',black:'#111111'};
const symName=v=>(SYMS.find(x=>x.v===v)||{l:v}).l, colName=v=>(COLS.find(x=>x.v===v)||{l:v}).l;
// símbolo de un punto: primera regla cuya descripción (código) empieza con el texto; si no, el símbolo por defecto
function symFor(p){
  const code=String(p.code||'').trim().toUpperCase();
  for(const r of S.symRules){ if(r.on===false) continue; const m=String(r.match||'').trim().toUpperCase(); if(m&&code.startsWith(m)) return {sym:r.sym,color:r.color}; }

}
function symShape(sym,x,y,r){
  const f=n=>n.toFixed(1);
  switch(sym){
    case 'triangle': return {d:'M'+f(x)+' '+f(y-r*1.25)+'L'+f(x+r*1.15)+' '+f(y+r*.85)+'L'+f(x-r*1.15)+' '+f(y+r*.85)+'Z'};
    case 'square': return {d:'M'+f(x-r)+' '+f(y-r)+'h'+f(2*r)+'v'+f(2*r)+'h'+f(-2*r)+'Z'};
    case 'diamond': return {d:'M'+f(x)+' '+f(y-r*1.3)+'L'+f(x+r*1.3)+' '+f(y)+'L'+f(x)+' '+f(y+r*1.3)+'L'+f(x-r*1.3)+' '+f(y)+'Z'};
    case 'cross': return {d:'M'+f(x-r*1.3)+' '+f(y)+'h'+f(2.6*r)+'M'+f(x)+' '+f(y-r*1.3)+'v'+f(2.6*r),line:true};
    case 'x': return {d:'M'+f(x-r)+' '+f(y-r)+'l'+f(2*r)+' '+f(2*r)+'M'+f(x+r)+' '+f(y-r)+'l'+f(-2*r)+' '+f(2*r),line:true};
    case 'star': { let d=''; for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, q=i%2?r*.55:r*1.35; d+=(i?'L':'M')+f(x+q*Math.cos(a))+' '+f(y+q*Math.sin(a)); } return {d:d+'Z'}; }
    default: return {d:'M'+f(x-r)+' '+f(y)+'a'+f(r)+' '+f(r)+' 0 1 0 '+f(2*r)+' 0a'+f(r)+' '+f(r)+' 0 1 0 '+f(-2*r)+' 0Z'};
  }
}
// estilo (cadena CSS) según color elegido
function symStyle(sh,color,input,stroke){
  const c=(color&&color!=='default')?COLHEX[color]:(input?'#5b6470':null);
  const col=c||'var(--pt)';
  return sh.line?'fill:none;stroke:'+col+';stroke-width:2.6;stroke-linecap:round':'fill:'+col+';stroke:'+(stroke||'var(--bg)')+';stroke-width:1.5;stroke-linejoin:round';
}
function symIcon(sym,color){
  const s=document.createElementNS(SVGNS,'svg'); s.setAttribute('class','ico2'); s.setAttribute('viewBox','0 0 24 24');
  if(sym!=='none'){ const sh=symShape(sym,12,12,7); const p=document.createElementNS(SVGNS,'path'); p.setAttribute('d',sh.d); p.setAttribute('style',symStyle(sh,color,false,'var(--row)')); s.appendChild(p); }

  return s;
}

screens.plan=()=>{
  const NS=SVGNS; const svg=document.createElementNS(NS,'svg'); svg.id='plan'; svg.setAttribute('role','img'); svg.setAttribute('aria-label','Dibujo en planta de los puntos');
  const view=h('div',{class:'view'},svg), info=infoBar();
  const msg=h('div',{class:'mapmsg',hidden:true});
  let V={x:0,y:0,k:1}, W=300, H=300, fitted=false, raf=0;
  const el=(n,a,t)=>{ const e=document.createElementNS(NS,n); if(a) for(const k in a) e.setAttribute(k,a[k]); if(t!=null) e.textContent=t; return e; };
  const X=e=>(e-V.x)*V.k+W/2, Y=n=>H/2-(n-V.y)*V.k;
  function bounds(){
    const pts=visPts().filter(p=>isFinite(p.e)&&isFinite(p.n)); if(!pts.length) return null;
    let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity; pts.forEach(p=>{ a=Math.min(a,p.e); c=Math.max(c,p.e); b=Math.min(b,p.n); d=Math.max(d,p.n); }); return {a,b,c,d};
  }
  function fit(){
    W=view.clientWidth||300; H=view.clientHeight||300; const B=bounds();
    if(!B){ V={x:0,y:0,k:1}; return; }
    const w=Math.max(B.c-B.a,0.5), hh=Math.max(B.d-B.b,0.5);
    V={x:(B.a+B.c)/2,y:(B.b+B.d)/2,k:Math.min((W-70)/w,(H-70)/hh)};
    fitted=true;
  }
  function draw(){
    raf=0; W=view.clientWidth||300; H=view.clientHeight||300;
    svg.setAttribute('viewBox','0 0 '+W+' '+H); svg.textContent='';
    if(!fitted&&proj.points.length) fit();
    const g=el('g'); svg.append(g);
    // cuadrícula
    const step=niceStep(70/V.k), e0=Math.floor((V.x-W/2/V.k)/step)*step, e1=V.x+W/2/V.k, n0=Math.floor((V.y-H/2/V.k)/step)*step, n1=V.y+H/2/V.k;
    if(S.grid&&(e1-e0)/step<80&&(n1-n0)/step<80){
      for(let e=e0;e<=e1;e+=step){ g.append(el('line',{class:'grid',x1:X(e),y1:0,x2:X(e),y2:H})); g.append(el('text',{class:'ax',x:X(e)+3,y:H-4},fmtN(e,step<1?2:0))); }
      for(let n=n0;n<=n1;n+=step){ g.append(el('line',{class:'grid',x1:0,y1:Y(n),x2:W,y2:Y(n)})); g.append(el('text',{class:'ax',x:3,y:Y(n)-3},fmtN(n,step<1?2:0))); }
    }
    // curvas de nivel
    const cn=getContours();
    msg.hidden=true;
    if(cn){
      cn.lines.forEach(l=>{ if(l.pts.length<2) return; let d=''; l.pts.forEach((p,i)=>{ d+=(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1); }); if(l.closed) d+='Z'; g.append(el('path',{class:'cl'+(l.index?' idx':''),d})); });
      if(V.k>0) cn.lines.forEach(l=>{ if(l.index&&l.pts.length>6){ const p=l.pts[Math.floor(l.pts.length/2)]; g.append(el('text',{class:'cll',x:X(p[0]),y:Y(p[1])},fmtN(l.z,l.z%1?2:0))); } });
      if(cn.info&&proj.points.length){ msg.textContent=cn.info; msg.hidden=false; }
    }
    // unir por código
    if(S.link){ const by={}; visPts().forEach(p=>{ if(p.code) (by[p.code]=by[p.code]||[]).push(p); });
      Object.values(by).forEach(a=>{ if(a.length>1) g.append(el('polyline',{class:'ln',points:a.map(p=>X(p.e).toFixed(1)+','+Y(p.n).toFixed(1)).join(' ')})); }); }
    // polígono del área
    if(areaPts.length>2 && p_showArea) g.append(el('polygon',{class:'poly',points:areaPts.map(p=>X(p.e).toFixed(1)+','+Y(p.n).toFixed(1)).join(' ')}));
    // puntos
    const vis=visPts().filter(p=>{ const x=X(p.e),y=Y(p.n); return x>-20&&x<W+20&&y>-20&&y<H+20; });
    const labels=vis.length<=350, lastVis=visPts().slice(-1)[0];
    vis.forEach(p=>{
      const x=X(p.e), y=Y(p.n), s=p===selPt;
      const sy=symFor(p), small=vis.length>1500, r=small?3:5.5;
      if(sy.sym!=='none'){ const sh=symShape(sy.sym,x,y,r); g.append(el('path',{d:sh.d,style:symStyle(sh,sy.color,p.type==='input')})); }

      out.append(band('Resultado WGS84'),row('Latitud',c[0].toFixed(8)+'°'),row('Longitud',c[1].toFixed(8)+'°'),row('Latitud (GMS)',fmtAngle(c[0],'dms',3)),row('Longitud (GMS)',fmtAngle(c[1],'dms',3))); } };
  const mk=()=>{ a.textContent='';
    if(st.mode==='ll2utm') a.append(inputRow('Latitud',{type:'number',unit:'°',inputmode:'decimal',value:st.lat,onInput:v=>{ st.lat=v; calc(); }}),inputRow('Longitud',{type:'number',unit:'°',inputmode:'decimal',value:st.lon,onInput:v=>{ st.lon=v; calc(); }}),h('div',{class:'note'},'Latitud sur y longitud oeste son negativas (Bogotá: 4.711, -74.072). Deja la zona vacía en el campo de abajo para que se calcule sola.'));
    else a.append(inputRow('Este',{type:'number',unit:'m',inputmode:'decimal',value:st.e,onInput:v=>{ st.e=v; calc(); }}),inputRow('Norte',{type:'number',unit:'m',inputmode:'decimal',value:st.n,onInput:v=>{ st.n=v; calc(); }}));
    calc(); };

    inputRow('Zona UTM',{type:'number',value:st.zone,inputmode:'numeric',onInput:v=>{ st.zone=v; calc(); }}),pickRow('Hemisferio','Hemisferio',[{v:true,l:'Sur'},{v:false,l:'Norte'}],()=>st.south,v=>{ st.south=v; calc(); }),out);

/* ====================== Vista 3D ====================== */
const RAMP=[[0,[63,107,90]],[.35,[170,185,110]],[.65,[217,194,122]],[.85,[168,110,70]],[1,[240,236,228]]];
function rampColor(t){ t=Math.max(0,Math.min(1,t)); for(let i=1;i<RAMP.length;i++){ if(t<=RAMP[i][0]){ const a=RAMP[i-1],b=RAMP[i],u=(t-a[0])/(b[0]-a[0]); return a[1].map((v,j)=>v+(b[1][j]-v)*u); } } return RAMP[RAMP.length-1][1]; }
screens.view3d=()=>{
  const cv=h('canvas',{id:'cv3',role:'img','aria-label':'Vista 3D del modelo de terreno',style:{position:'absolute',inset:0,width:'100%',height:'100%',touchAction:'none'}});
  const view=h('div',{class:'view'},cv), info=h('div',{class:'infobar'}), msg=h('div',{class:'mapmsg',hidden:true});
  const DEG=Math.PI/180; let M=null, W=300, H=300, dpr=1, yaw=35, pitch=40, k=1, kk=1, panX=0, panY=0, ex=1, raf=0, ce=0, cn=0, cz=0, ctx=null, PP=[];
  function setup(){
    M=getModel(); const ok=M&&M.P&&M.tris&&M.tris.length;
    if(!ok){ msg.textContent=(M&&M.info)||'Se necesitan al menos 3 puntos con cota.'; msg.hidden=false; M=null; return; }
    msg.hidden=true; let a=1e99,b=1e99,c=-1e99,d=-1e99; M.P.forEach(p=>{ a=Math.min(a,p.x); c=Math.max(c,p.x); b=Math.min(b,p.y); d=Math.max(d,p.y); });
    ce=(a+c)/2; cn=(b+d)/2; cz=(M.zmin+M.zmax)/2;
    const span=Math.max(c-a,d-b,1), zr=Math.max(M.zmax-M.zmin,1e-6); ex=Math.max(1,Math.min(40,0.3*span/zr));
  }
  function pr(e,n,z){ const x=e-ce, y=n-cn, zz=(z-cz)*ex, cy=Math.cos(yaw*DEG), sy=Math.sin(yaw*DEG), sp=Math.sin(pitch*DEG), cp=Math.cos(pitch*DEG), K=k*kk;
    const xr=x*cy-y*sy, yr=x*sy+y*cy; return [W/2+panX+xr*K, H/2+panY-(yr*sp+zz*cp)*K, yr*cp-zz*sp]; }
  function fit(){
    if(!M) return; kk=1; panX=0; panY=0; const save=k; k=1; let a=1e99,b=1e99,c=-1e99,d=-1e99;
    M.P.forEach(p=>{ const q=pr(p.x,p.y,p.z); a=Math.min(a,q[0]-W/2); c=Math.max(c,q[0]-W/2); b=Math.min(b,q[1]-H/2); d=Math.max(d,q[1]-H/2); });
    k=Math.min((W-50)/Math.max(c-a,1e-6),(H-110)/Math.max(d-b,1e-6)); if(!isFinite(k)||k<=0) k=save;
  }
  function size(){ dpr=Math.min(window.devicePixelRatio||1,2); W=view.clientWidth||300; H=view.clientHeight||300; cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); ctx=cv.getContext('2d'); }
  const L=(()=>{ const v=[-.35,-.45,.82], m=Math.hypot(...v); return v.map(x=>x/m); })();
  function draw(){
    raf=0; if(!ctx) return; const cs=getComputedStyle(document.body); const bg=cs.getPropertyValue('--bg').trim()||'#eee', fg=cs.getPropertyValue('--fg').trim()||'#222';
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
    if(!M){ info.textContent=''; return; }
    const P=M.P, T=M.tris, step=M.step; PP=P.map(p=>pr(p.x,p.y,p.z));
    const order=T.map((t,i)=>[i,(PP[t[0]][2]+PP[t[1]][2]+PP[t[2]][2])/3]).sort((u,v)=>v[1]-u[1]);
    const zr=Math.max(M.zmax-M.zmin,1e-9); ctx.lineJoin='round';
    for(const [i] of order){
      const t=T[i], A=PP[t[0]], B=PP[t[1]], C=PP[t[2]], a=P[t[0]], b=P[t[1]], c=P[t[2]];
      if(S.surf3){
        const ux=b.x-a.x, uy=b.y-a.y, uz=(b.z-a.z)*ex, vx=c.x-a.x, vy=c.y-a.y, vz=(c.z-a.z)*ex;
        let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx; if(nz<0){ nx=-nx; ny=-ny; nz=-nz; } const m=Math.hypot(nx,ny,nz)||1;
        const sh=0.5+0.5*Math.max(0,(nx*L[0]+ny*L[1]+nz*L[2])/m), col=rampColor(((a.z+b.z+c.z)/3-M.zmin)/zr).map(v=>Math.round(v*(0.55+0.45*sh))), st='rgb('+col+')';
        ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.lineTo(C[0],C[1]); ctx.closePath(); ctx.fillStyle=st; ctx.strokeStyle=st; ctx.lineWidth=.7; ctx.fill(); ctx.stroke();
      } else if(!S.cn3){
        ctx.beginPath(); ctx.moveTo(A[0],A[1]); ctx.lineTo(B[0],B[1]); ctx.lineTo(C[0],C[1]); ctx.closePath(); ctx.strokeStyle=fg; ctx.globalAlpha=.35; ctx.lineWidth=.6; ctx.stroke(); ctx.globalAlpha=1;
      }
      if(S.cn3&&step>0){
        const lo=Math.min(a.z,b.z,c.z), hi=Math.max(a.z,b.z,c.z), V=[[a,A],[b,B],[c,C]];
        for(let li=Math.ceil(lo/step-1e-9); li<=Math.floor(hi/step+1e-9); li++){
          const lv=li*step, pts=[];
          for(let e=0;e<3;e++){ const [p,P1]=V[e], [q,Q1]=V[(e+1)%3]; if((p.z>=lv)!==(q.z>=lv)){ const u=(lv-p.z)/(q.z-p.z); pts.push([P1[0]+(Q1[0]-P1[0])*u,P1[1]+(Q1[1]-P1[1])*u]); } }
          if(pts.length===2){ const idx=li%5===0; ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); ctx.lineTo(pts[1][0],pts[1][1]); ctx.strokeStyle=S.surf3?(idx?'rgba(55,25,5,.95)':'rgba(55,25,5,.6)'):(idx?'#9a4a08':'#c9873f'); ctx.lineWidth=idx?1.7:.9; ctx.stroke(); }
        }
      }
    }
    if(S.pts3){ visPts().forEach(p=>{ if(!isFinite(p.z)) return; const q=pr(p.e,p.n,p.z), sy=symFor(p); if(sy.sym==='none') return;
      const col=(sy.color&&sy.color!=='default')?COLHEX[sy.color]:(p.type==='input'?'#5b6470':'#b87a1a'), sh=symShape(sy.sym,q[0],q[1],3.6), p2=new Path2D(sh.d);
      if(sh.line){ ctx.strokeStyle=col; ctx.lineWidth=2.4; ctx.stroke(p2); } else { ctx.fillStyle=col; ctx.strokeStyle='#fff'; ctx.lineWidth=1.4; ctx.fill(p2); ctx.stroke(p2); } }); }
    // brújula
    const cy=Math.cos(yaw*DEG), sy=Math.sin(yaw*DEG), sp=Math.sin(pitch*DEG), nxs=-sy*28, nys=-(cy*sp)*28, bx=W-120, by=48;
    ctx.strokeStyle=fg; ctx.fillStyle=fg; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(bx,by,20,0,7); ctx.globalAlpha=.25; ctx.stroke(); ctx.globalAlpha=1;
    ctx.beginPath(); ctx.moveTo(bx,by); ctx.lineTo(bx+nxs*.7,by+nys*.7); ctx.stroke(); ctx.font='bold 12px system-ui,sans-serif'; ctx.textAlign='center'; ctx.fillText('N',bx+nxs*.95,by+nys*.95+4);
    // leyenda de cotas
    const lx=14, ly=H-56, lw=110; for(let i=0;i<lw;i++){ ctx.fillStyle='rgb('+rampColor(i/(lw-1))+')'; ctx.fillRect(lx+i,ly,1,10); }
    ctx.fillStyle=fg; ctx.font='11px system-ui,sans-serif'; ctx.textAlign='left'; ctx.fillText(fmtN(M.zmin,2)+' m',lx,ly+24); ctx.textAlign='right'; ctx.fillText(fmtN(M.zmax,2)+' m',lx+lw,ly+24);
    info.textContent=''; info.append(h('b',null,'Vista 3D'),h('span',{style:{textAlign:'right'}},T.length+' triángulos'),h('span',null,'Exageración vertical ×'+ex.toFixed(ex<10?1:0)),h('span',{style:{textAlign:'right'}},step>0?'Curvas cada '+fmtN(step,step<1?2:1)+' m':''));
  }
  const sched=()=>{ if(!raf) raf=requestAnimationFrame(draw); };
  const ptrs=new Map(); let mode='rot';
  const zoomAt=(px,py,f)=>{ const nk=Math.max(.2,Math.min(30,kk*f)); f=nk/kk; panX=px-W/2-(px-W/2-panX)*f; panY=py-H/2-(py-H/2-panY)*f; kk=nk; };
  cv.addEventListener('contextmenu',e=>e.preventDefault());
  cv.addEventListener('pointerdown',e=>{ cv.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,pan:e.button===2||e.shiftKey||e.ctrlKey}); });
  cv.addEventListener('pointermove',e=>{ const o=ptrs.get(e.pointerId); if(!o) return; const r=cv.getBoundingClientRect();
    if(ptrs.size===1){ const dx=e.clientX-o.x, dy=e.clientY-o.y;
      if(mode==='pan'||o.pan){ panX+=dx; panY+=dy; } else { yaw+=dx*.5; pitch=Math.max(8,Math.min(89,pitch+dy*.35)); }
      o.x=e.clientX; o.y=e.clientY; sched(); }
    else if(ptrs.size>=2){ const [a,b]=[...ptrs.values()]; const mx0=(a.x+b.x)/2, my0=(a.y+b.y)/2, d0=Math.hypot(a.x-b.x,a.y-b.y);
      o.x=e.clientX; o.y=e.clientY; const mx1=(a.x+b.x)/2, my1=(a.y+b.y)/2, d1=Math.hypot(a.x-b.x,a.y-b.y);
      panX+=mx1-mx0; panY+=my1-my0; if(d0>0&&d1>0) zoomAt(mx1-r.left,my1-r.top,d1/d0); sched(); } });
  const up=e=>ptrs.delete(e.pointerId); cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',e=>{ e.preventDefault(); const r=cv.getBoundingClientRect(); zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.15:.87); sched(); },{passive:false});
  const onResize=()=>{ size(); fit(); sched(); }; window.addEventListener('resize',onResize);
  const reset=()=>{ yaw=35; pitch=40; fit(); sched(); };
  const tog=(key,txt)=>()=>{ S[key]=!S[key]; saveS(); toast(txt+(S[key]?' visible':' oculta')); sched(); };
  const fabs=h('div',{class:'fab'},fab(ico('plan'),'Restablecer vista',reset),fab('✥','Cambiar entre girar y mover la vista',(e)=>{ mode=mode==='rot'?'pan':'rot'; e.currentTarget.classList.toggle('on',mode==='pan'); toast(mode==='pan'?'Un dedo mueve la vista':'Un dedo gira la vista'); }),fab('Z+','Aumentar exageración vertical',()=>{ ex=Math.min(80,ex*1.4); sched(); }),fab('Z−','Reducir exageración vertical',()=>{ ex=Math.max(.5,ex/1.4); sched(); }),
    fab('▤','Mostrar u ocultar la superficie',tog('surf3','Superficie')),fab('≋','Mostrar u ocultar las curvas de nivel',tog('cn3','Curvas de nivel')),fab('•','Mostrar u ocultar los puntos',tog('pts3','Puntos')),
    fab('◐','Cambiar tema claro / oscuro',()=>{ S.theme=isDark()?'light':'dark'; saveS(); applyTheme(); }),fab('⛶','Pantalla completa',toggleImm));
  view.append(fabs,msg);
  return {title:'Vista 3D',body:h('div',{class:'stage'},view,info),full:true,
    help:'Modelo del terreno en 3D con las curvas de nivel. Arrastra con un dedo para girar e inclinar; con dos dedos mueves la vista y acercas o alejas. El botón ✥ hace que un solo dedo mueva en lugar de girar. En computador: clic derecho o Mayús + arrastrar para mover, y la rueda para acercar. «Z+» y «Z−» cambian la exageración vertical: en terrenos casi planos conviene exagerar para ver el relieve. El modelo se actualiza solo cuando llegan puntos nuevos.',
    themed:()=>sched(),refresh:()=>{ const had=!!M; setup0(); sched(); },
    mounted:()=>{ setTimeout(()=>{ size(); setup(); fit(); draw(); },30); },leave:()=>{ window.removeEventListener('resize',onResize); cancelAnimationFrame(raf); }};
  function setup0(){ const e0=ex; const was=M; setup(); if(was&&M) ex=e0; if(M&&!was) fit(); }
};

document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));

function hardBack(){
  if(dlgEl){ closeDlg(); return; }
  if(document.body.classList.contains('imm')){ toggleImm(); return; }
  if(stack.length){ back(); return; }

}
